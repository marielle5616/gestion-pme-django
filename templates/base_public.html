<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BizManager - Gestion PME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
            scroll-behavior: smooth
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            z-index: 1000;
            box-shadow: 0 2px 10px #00000014
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-soft {
            padding: 10px 20px;
            border-radius: 999px;
            /* très soft */
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all .2s ease;
        }

        .btn-login {
            color: #0d6efd;
            background: #eef3ff;
            /* bleu très clair */
            border: 1px solid #dbe7ff;
        }

        .btn-login:hover {
            background: #e0ebff;
        }

        .btn-start-soft {
            color: white;
            background: #0d6efd;
            box-shadow: 0 4px 14px rgba(13, 110, 253, .25);
            /* ombre douce */
        }

        .btn-start-soft:hover {
            background: #0b5ed7;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(13, 110, 253, .32);
        }

        .logo {
            font-weight: 800;
            color: #0d6efd;
            font-size: 20px;
            text-decoration: none
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 22px
        }

        .navbar ul a {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            font-size: 14px
        }

        .btn-outline {
            border: 1.5px solid #0d6efd;
            color: #0d6efd;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none
        }

        .btn-blue {
            background: #0d6efd;
            color: white;
            padding: 9px 19px;
            border-radius: 6px;
            text-decoration: none
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/" class="logo">BizManager</a>
        <ul>
            <li><a href="#fonctionnalites">Fonctionnalités</a></li>
            <li><a href="#interface">Interface</a></li>
            <li><a href="#statistiques">Statistiques</a></li>
            <li><a href="#temoignages">Témoignages</a></li>
            <li><a href="#tarifs">Tarifs</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div>
            <div class="nav-actions">
                <a href="#" onclick="openAuth('login');return false;" class="btn-soft btn-login">Connexion</a>
                <a href="#" onclick="openAuth('register');return false;" class="btn-soft btn-start-soft">Commencer
                    gratuitement</a>
            </div>

        </div>
    </div>
    {% block content %}{% endblock %}
</body>

</html>
